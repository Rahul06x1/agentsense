[project]
# PyPI distribution name (import package and CLI stay `agentsense`); the bare
# `agentsense` name is blocked on PyPI as too similar to the existing `agent-sense`.
name = "agentsense-ai"
version = "0.1.4"
description = "Make sense of what your AI agents did — local-first, MCP-native observability, trace replay & trajectory diff."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Rajeev", email = "rahulrajeev2k1@gmail.com" }]
keywords = [
    "agents", "observability", "debugging", "mcp", "model-context-protocol",
    "llm", "tracing", "replay", "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Bedrock (Converse) for dev; OpenAI-compatible for the eventual OSS release.
# Not needed for the proxy — only the replay engine (fast-follow).
replay = [
    "boto3>=1.43",
    "openai>=2.0",
]
# Local read-only web UI over the trace store. Not needed for the proxy.
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agentsense = "agentsense.cli:main"

[project.urls]
Homepage = "https://github.com/Rahul06x1/agentsense"
Repository = "https://github.com/Rahul06x1/agentsense"
Issues = "https://github.com/Rahul06x1/agentsense/issues"

[dependency-groups]
dev = [
    "mcp>=1.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name (agentsense-ai) differs from the import package (agentsense),
# so point hatchling at the package explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/agentsense"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
