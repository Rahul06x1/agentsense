name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync (dev + ui + replay)
        run: uv sync --group dev --extra ui --extra replay

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
