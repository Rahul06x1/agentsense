<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agentsense</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #d6dae2;
      --muted: #8b93a3; --accent: #6ea8fe;
      --mcp: #4cc9f0; --llm: #b892ff; --tool: #74d99f; --reason: #f2c14e; --session: #9aa4b2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: var(--bg); color: var(--fg); }
    header { padding: 10px 16px; border-bottom: 1px solid var(--line);
             display: flex; align-items: baseline; gap: 12px; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
    header .sub { color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 43px); }
    .list, .detail { overflow: auto; }
    .list { border-right: 1px solid var(--line); }
    .trace { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .trace:hover { background: var(--panel); }
    .trace.active { background: var(--panel); border-left: 2px solid var(--accent); }
    .trace .title { font-weight: 600; }
    .trace .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px;
             background: var(--line); color: var(--fg); margin-right: 4px; }
    .detail { padding: 16px 20px; }
    .detail h2 { font-size: 14px; margin: 0 0 2px; }
    .detail .traceid { color: var(--muted); font-size: 11px; word-break: break-all; }
    .row { display: grid; grid-template-columns: 210px 1fr 90px; gap: 10px;
           align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kind { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
    .k-mcp_call { background: var(--mcp); } .k-llm_call { background: var(--llm); }
    .k-tool_call { background: var(--tool); } .k-reasoning { background: var(--reason); }
    .k-session { background: var(--session); }
    .track { position: relative; height: 14px; background: #10131a; border-radius: 3px; }
    .bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; min-width: 2px; opacity: .9; }
    .lat { text-align: right; color: var(--muted); font-size: 11px; }
    .lock { color: var(--reason); font-size: 11px; margin-left: 6px; }
    .empty { color: var(--muted); padding: 24px; }
    header nav { margin-left: auto; display: flex; gap: 4px; }
    header nav button { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
    header nav button.active { border-color: var(--accent); color: var(--accent); }
    .cmp-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .cmp-controls select { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 8px; font: inherit; }
    .cmp-controls button { background: var(--accent); color: #0b0e13; border: 0; border-radius: 6px;
      padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 600; }
    .summary { padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; }
    .summary.aligned { background: #14251a; color: var(--tool); border: 1px solid #1f4030; }
    .summary.diverge { background: #2a1618; color: #ff8a8a; border: 1px solid #46252a; }
    .summary.fork { background: #2a2413; color: var(--reason); border: 1px solid #4a3f1e; }
    .summary.suspect { background: #2a2413; color: var(--reason); border: 1px solid #4a3f1e; margin-top: -6px; }
    .diff-grid { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 8px; align-items: stretch; }
    .diff-head { color: var(--muted); font-size: 11px; padding: 4px 8px; }
    .cell { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
    .cell.same { opacity: .7; }
    .cell.diverge { border-color: #a33; background: #2a1618; }
    .cell.missing { color: var(--muted); font-style: italic; }
    .idx { color: var(--muted); text-align: right; padding: 6px 4px; }
    .idx.diverge { color: #ff8a8a; font-weight: 700; }
    .replay-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .replay-box select, .replay-box input { background: var(--bg); color: var(--fg);
      border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
    .replay-box input { min-width: 180px; }
    .replay-box button { background: var(--accent); color: #0b0e13; border: 0; border-radius: 6px;
      padding: 5px 12px; cursor: pointer; font: inherit; font-weight: 600; }
    .rp-status { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <h1>agentsense</h1>
    <span class="sub">local trace explorer · read-only</span>
    <nav>
      <button id="nav-explore" class="active" onclick="setMode('explore')">Explorer</button>
      <button id="nav-compare" onclick="setMode('compare')">Compare</button>
    </nav>
  </header>
  <div class="layout">
    <div class="list" id="list"><div class="empty">loading traces…</div></div>
    <div class="detail" id="detail"><div class="empty">select a trace</div></div>
  </div>

  <script>
    const KIND_COLOR = { mcp_call: "var(--mcp)", llm_call: "var(--llm)",
      tool_call: "var(--tool)", reasoning: "var(--reason)", session: "var(--session)" };
    const fmtMs = (ms) => ms == null ? "—" : (ms < 1000 ? ms.toFixed(0) + "ms" : (ms / 1000).toFixed(2) + "s");

    let allTraces = [];

    function setMode(mode) {
      document.getElementById("nav-explore").classList.toggle("active", mode === "explore");
      document.getElementById("nav-compare").classList.toggle("active", mode === "compare");
      const detail = document.getElementById("detail");
      if (mode === "compare") renderCompare(detail);
      else detail.innerHTML = '<div class="empty">select a trace</div>';
    }

    function renderCompare(detail) {
      const opts = allTraces.map(t =>
        `<option value="${t.trace_id}">${t.name || t.trace_id}</option>`).join("");
      detail.innerHTML = `
        <div class="cmp-controls">
          <span>A</span><select id="cmp-a">${opts}</select>
          <span>vs B</span><select id="cmp-b">${opts}</select>
          <button onclick="doCompare()">Compare trajectories</button>
        </div>
        <div id="cmp-result"><div class="empty">pick two traces and compare</div></div>`;
      if (allTraces[1]) document.getElementById("cmp-b").selectedIndex = 1;
    }

    function decisionLabel(d) {
      if (!d) return { text: "—", cls: "missing" };
      if (d.kind === "tool_call")
        return { text: `call ${d.tool_name}(${JSON.stringify(d.tool_input)})`, cls: "" };
      return { text: "✓ final answer", cls: "" };
    }

    function diffGridHTML(d) {
      const headA = d.a.label || d.a.model_id || d.a.trace_id;
      const headB = d.b.label || d.b.model_id || d.b.trace_id;
      const n = Math.max(d.a.decisions.length, d.b.decisions.length);
      const div = d.first_divergence;
      let rows = `<div class="diff-grid">
        <div class="diff-head"></div>
        <div class="diff-head">${headA}</div>
        <div class="diff-head">${headB}</div>`;
      for (let i = 0; i < n; i++) {
        const la = decisionLabel(d.a.decisions[i]);
        const lb = decisionLabel(d.b.decisions[i]);
        const isDiv = i === div;
        const cellCls = isDiv ? "diverge" : (div === null || i < div ? "same" : "");
        rows += `<div class="idx ${isDiv ? "diverge" : ""}">${i}</div>
          <div class="cell ${cellCls} ${la.cls}">${la.text}</div>
          <div class="cell ${cellCls} ${lb.cls}">${lb.text}</div>`;
      }
      rows += `</div>`;
      const cls = d.kind === "aligned" ? "aligned"
        : (d.kind === "unresolvable_fork" ? "fork" : "diverge");
      const suspect = d.redaction_suspect
        ? `<div class="summary suspect">⚠ a redacted value is in play before the divergence — it may be caused by redaction, not the model</div>`
        : "";
      return `<div class="summary ${cls}">${d.summary}</div>` + suspect + rows;
    }

    async function doCompare() {
      const a = document.getElementById("cmp-a").value;
      const b = document.getElementById("cmp-b").value;
      const d = await (await fetch(`/api/diff?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`)).json();
      document.getElementById("cmp-result").innerHTML = diffGridHTML(d);
    }

    async function runReplay(traceId) {
      const status = document.getElementById("rp-status");
      const model = document.getElementById("rp-model").value.trim();
      if (!model) { status.textContent = "enter a model id"; return; }
      const body = {
        trace_id: traceId,
        adapter: document.getElementById("rp-adapter").value,
        model,
        base_url: document.getElementById("rp-baseurl").value.trim() || null,
        on_unrecorded: document.getElementById("rp-policy").value,
      };
      status.textContent = "replaying…";
      const resp = await fetch("/api/replay", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const d = await resp.json();
      if (!resp.ok) { status.textContent = "error: " + (d.detail || resp.status); return; }
      const u = d.replay;
      status.textContent = `done · ${u.input_tokens}/${u.output_tokens} tok`
        + (u.stopped_reason ? ` · ${u.stopped_reason}` : "");
      document.getElementById("rp-result").innerHTML = diffGridHTML(d);
    }

    async function loadTraces() {
      const traces = await (await fetch("/api/traces")).json();
      allTraces = traces;
      const list = document.getElementById("list");
      if (!traces.length) { list.innerHTML = '<div class="empty">no traces yet</div>'; return; }
      list.innerHTML = "";
      for (const t of traces) {
        const el = document.createElement("div");
        el.className = "trace";
        el.dataset.id = t.trace_id;
        const kinds = t.kinds.map(k => `<span class="badge">${k}</span>`).join("");
        el.innerHTML = `<div class="title">${t.name || t.trace_id.slice(0, 12)}</div>
          <div class="meta">${kinds} · ${t.span_count} spans · ${t.tool_calls} tools · ${fmtMs(t.duration_ms)}</div>`;
        el.onclick = () => selectTrace(t.trace_id, el);
        list.appendChild(el);
      }
    }

    async function selectTrace(id, el) {
      document.getElementById("nav-explore").classList.add("active");
      document.getElementById("nav-compare").classList.remove("active");
      document.querySelectorAll(".trace").forEach(x => x.classList.remove("active"));
      if (el) el.classList.add("active");
      const data = await (await fetch(`/api/traces/${encodeURIComponent(id)}/spans`)).json();
      renderDetail(data);
    }

    function renderDetail(data) {
      const spans = data.spans;
      const starts = spans.map(s => s.ts_start);
      const ends = spans.map(s => s.ts_end ?? s.ts_start);
      const t0 = Math.min(...starts), t1 = Math.max(...ends);
      const span_ms = Math.max((t1 - t0) * 1000, 1);

      // Build a shallow tree: session root(s) first, children indented.
      const byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
      const depth = (s) => (s.parent_span_id && byId[s.parent_span_id]) ? 1 : 0;

      const detail = document.getElementById("detail");
      const header = `<h2>${data.trace_id}</h2>
        <div class="traceid">${spans.length} spans · ${fmtMs(span_ms)} · 🔒 ${data.redaction_count} redactions</div>
        <div style="height:12px"></div>`;

      // Live replay is only possible for traces that captured the model conversation.
      const replayable = spans.some(s => s.kind === "llm_call");
      const replayBox = replayable ? `
        <div class="replay-box">
          <span>Replay with</span>
          <select id="rp-adapter">
            <option value="openai">OpenAI-compatible / Ollama</option>
            <option value="bedrock">AWS Bedrock</option>
          </select>
          <input id="rp-model" placeholder="model id (e.g. gpt-4o-mini)" />
          <input id="rp-baseurl" placeholder="base URL (optional, e.g. Ollama)" />
          <select id="rp-policy" title="What to do if the replay calls a tool the trace didn't record">
            <option value="stop">on fork: stop</option>
            <option value="stub">on fork: stub</option>
          </select>
          <button onclick="runReplay('${data.trace_id}')">Run replay</button>
          <span id="rp-status" class="rp-status"></span>
        </div>
        <div id="rp-result"></div>
        <div style="height:12px"></div>` : "";

      const rows = spans.map(s => {
        const left = ((s.ts_start - t0) * 1000 / span_ms) * 100;
        const width = ((s.latency_ms ?? 0) / span_ms) * 100;
        const label = s.name || s.tool_name || s.method || s.kind;
        const pad = depth(s) * 16;
        const nred = (s.redactions || []).length;
        const lock = nred ? `<span class="lock" title="${nred} redactions">🔒${nred}</span>` : "";
        return `<div class="row">
          <div class="label" style="padding-left:${pad}px">
            <span class="kind k-${s.kind}"></span>${label}${lock}</div>
          <div class="track"><div class="bar" style="left:${left}%;width:${Math.max(width, 0.5)}%;
            background:${KIND_COLOR[s.kind] || "#888"}"></div></div>
          <div class="lat">${fmtMs(s.latency_ms)}</div>
        </div>`;
      }).join("");

      detail.innerHTML = header + replayBox + rows;
    }

    loadTraces();
  </script>
</body>
</html>
