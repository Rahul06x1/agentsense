<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tracekit</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #d6dae2;
      --muted: #8b93a3; --accent: #6ea8fe;
      --mcp: #4cc9f0; --llm: #b892ff; --tool: #74d99f; --reason: #f2c14e; --session: #9aa4b2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: var(--bg); color: var(--fg); }
    header { padding: 10px 16px; border-bottom: 1px solid var(--line);
             display: flex; align-items: baseline; gap: 12px; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: .5px; }
    header .sub { color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 43px); }
    .list, .detail { overflow: auto; }
    .list { border-right: 1px solid var(--line); }
    .trace { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .trace:hover { background: var(--panel); }
    .trace.active { background: var(--panel); border-left: 2px solid var(--accent); }
    .trace .title { font-weight: 600; }
    .trace .meta { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px;
             background: var(--line); color: var(--fg); margin-right: 4px; }
    .detail { padding: 16px 20px; }
    .detail h2 { font-size: 14px; margin: 0 0 2px; }
    .detail .traceid { color: var(--muted); font-size: 11px; word-break: break-all; }
    .row { display: grid; grid-template-columns: 210px 1fr 90px; gap: 10px;
           align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kind { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
    .k-mcp_call { background: var(--mcp); } .k-llm_call { background: var(--llm); }
    .k-tool_call { background: var(--tool); } .k-reasoning { background: var(--reason); }
    .k-session { background: var(--session); }
    .track { position: relative; height: 14px; background: #10131a; border-radius: 3px; }
    .bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; min-width: 2px; opacity: .9; }
    .lat { text-align: right; color: var(--muted); font-size: 11px; }
    .lock { color: var(--reason); font-size: 11px; margin-left: 6px; }
    .empty { color: var(--muted); padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>tracekit</h1>
    <span class="sub">local trace explorer · read-only</span>
  </header>
  <div class="layout">
    <div class="list" id="list"><div class="empty">loading traces…</div></div>
    <div class="detail" id="detail"><div class="empty">select a trace</div></div>
  </div>

  <script>
    const KIND_COLOR = { mcp_call: "var(--mcp)", llm_call: "var(--llm)",
      tool_call: "var(--tool)", reasoning: "var(--reason)", session: "var(--session)" };
    const fmtMs = (ms) => ms == null ? "—" : (ms < 1000 ? ms.toFixed(0) + "ms" : (ms / 1000).toFixed(2) + "s");

    async function loadTraces() {
      const traces = await (await fetch("/api/traces")).json();
      const list = document.getElementById("list");
      if (!traces.length) { list.innerHTML = '<div class="empty">no traces yet</div>'; return; }
      list.innerHTML = "";
      for (const t of traces) {
        const el = document.createElement("div");
        el.className = "trace";
        el.dataset.id = t.trace_id;
        const kinds = t.kinds.map(k => `<span class="badge">${k}</span>`).join("");
        el.innerHTML = `<div class="title">${t.name || t.trace_id.slice(0, 12)}</div>
          <div class="meta">${kinds} · ${t.span_count} spans · ${t.tool_calls} tools · ${fmtMs(t.duration_ms)}</div>`;
        el.onclick = () => selectTrace(t.trace_id, el);
        list.appendChild(el);
      }
    }

    async function selectTrace(id, el) {
      document.querySelectorAll(".trace").forEach(x => x.classList.remove("active"));
      if (el) el.classList.add("active");
      const data = await (await fetch(`/api/traces/${encodeURIComponent(id)}/spans`)).json();
      renderDetail(data);
    }

    function renderDetail(data) {
      const spans = data.spans;
      const starts = spans.map(s => s.ts_start);
      const ends = spans.map(s => s.ts_end ?? s.ts_start);
      const t0 = Math.min(...starts), t1 = Math.max(...ends);
      const span_ms = Math.max((t1 - t0) * 1000, 1);

      // Build a shallow tree: session root(s) first, children indented.
      const byId = Object.fromEntries(spans.map(s => [s.span_id, s]));
      const depth = (s) => (s.parent_span_id && byId[s.parent_span_id]) ? 1 : 0;

      const detail = document.getElementById("detail");
      const header = `<h2>${data.trace_id}</h2>
        <div class="traceid">${spans.length} spans · ${fmtMs(span_ms)} · 🔒 ${data.redaction_count} redactions</div>
        <div style="height:12px"></div>`;

      const rows = spans.map(s => {
        const left = ((s.ts_start - t0) * 1000 / span_ms) * 100;
        const width = ((s.latency_ms ?? 0) / span_ms) * 100;
        const label = s.name || s.tool_name || s.method || s.kind;
        const pad = depth(s) * 16;
        const nred = (s.redactions || []).length;
        const lock = nred ? `<span class="lock" title="${nred} redactions">🔒${nred}</span>` : "";
        return `<div class="row">
          <div class="label" style="padding-left:${pad}px">
            <span class="kind k-${s.kind}"></span>${label}${lock}</div>
          <div class="track"><div class="bar" style="left:${left}%;width:${Math.max(width, 0.5)}%;
            background:${KIND_COLOR[s.kind] || "#888"}"></div></div>
          <div class="lat">${fmtMs(s.latency_ms)}</div>
        </div>`;
      }).join("");

      detail.innerHTML = header + rows;
    }

    loadTraces();
  </script>
</body>
</html>
